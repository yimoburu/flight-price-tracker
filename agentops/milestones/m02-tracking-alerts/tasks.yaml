              return_date_from: searchParams.return_date_from || null,
              return_date_to: searchParams.return_date_to || null,
              adults: searchParams.adults,
              max_stops: searchParams.max_stops,
              threshold_price: parseFloat(threshold),
              alert_email: email,
          - Call createTrackedSearch(body)
          - On success: setModalOpen(false), setIsTracking(true), reset form state
          - On error: setFormError(error.message), set submitting=false
