          - check_single_tracked_search calls send_price_alert when price < previous best AND price <= threshold
          - check_single_tracked_search does NOT call send_price_alert when price > threshold
          - check_single_tracked_search does NOT call send_price_alert when price <= threshold but NOT < previous best
