        from contextlib import asynccontextmanager
        from fastapi import FastAPI
        from fastapi.middleware.cors import CORSMiddleware
        from amadeus import ResponseError

        from app.api.error_handlers import amadeus_exception_handler
        from app.api.search import router as search_router
        from app.api.tracking import router as tracking_router
        from app.config import get_settings
        from app.db import engine
        import app.models.tracked_search  # noqa: F401 — registers models with Base

        @asynccontextmanager
        async def lifespan(app: FastAPI):
            from app.db import Base
            Base.metadata.create_all(bind=engine)
            yield  # scheduler is added in t06; yield is sufficient here

        def create_app() -> FastAPI:
            settings = get_settings()
            application = FastAPI(
                title="Flight Price Tracker",
                version="0.1.0",
                lifespan=lifespan,
            )
            application.add_middleware(
                CORSMiddleware,
                allow_origins=settings.cors_origins.split(","),
                allow_methods=["*"],
                allow_headers=["*"],
                allow_credentials=True,
            )
            application.include_router(search_router)
            application.include_router(tracking_router)
            application.add_exception_handler(ResponseError, amadeus_exception_handler)
            return application

        app = create_app()

