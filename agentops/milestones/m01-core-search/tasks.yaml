      search_airports with mock client returning 2 airports:
        input: query="LON", mock amadeus response with 2 location objects:
          [{iataCode: "LHR", name: "Heathrow", address: {cityName: "London", countryName: "United Kingdom"}},
           {iataCode: "LGW", name: "Gatwick",  address: {cityName: "London", countryName: "United Kingdom"}}]
        expected: returns [AirportResult(iata_code="LHR", name="Heathrow", city="London", country="United Kingdom"),
                           AirportResult(iata_code="LGW", name="Gatwick", city="London", country="United Kingdom")]

      search_airports with empty response:
        input: mock client returns []
        expected: returns []

      Integration test via TestClient:

      GET /api/v1/airports?q=LO (too short):
        expected: 422 (FastAPI Query min_length=3 validation)

      GET /api/v1/airports?q=LON with mock amadeus returning 2 airports:
        expected: 200, JSON array of 2 AirportResult objects

    implementation_guidelines: |
      - SDK call: `client.reference_data.locations.get(keyword=query, subType=Location.ANY, **{'page[limit]': 10})`
        Note: `page[limit]` must be passed as a string key via `**{}` syntax because
        square brackets are not valid Python kwarg names.
      - Response data is in `response.data` — a list of dicts.
      - Map response fields:
          iata_code = item['iataCode']
          name      = item['name']
          city      = item.get('address', {}).get('cityName', '')
          country   = item.get('address', {}).get('countryName', '')
      - For unit tests, mock the amadeus client:
        ```python
