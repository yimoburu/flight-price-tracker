      navigation and accessibility attributes.
    interfaces: |
      File: frontend/src/components/AirportAutocomplete/index.tsx

      interface AirportAutocompleteProps {
        label: string;                    // e.g. "Origin" or "Destination"
        value: AirportResult | null;
