  - id: t11
    name: price-grid-component
    description: |
      Implement the PriceGrid component that displays a 1D table (one-way) or 2D
      matrix (round-trip) of prices color-coded from green (cheapest) to red (most
      expensive). Includes toggle between list and grid views.
    interfaces: |
      File: frontend/src/components/PriceGrid/index.tsx

      interface PriceGridProps {
        offers: FlightOfferResponse[];
        tripType: 'one_way' | 'round_trip';
      }

      export function PriceGrid(props: PriceGridProps): JSX.Element

      One-way grid (1D):
        Table with columns: "Departure Date" | "Price"
        One row per unique departure_date, showing the cheapest price for that date.
        Rows sorted by date ascending.
        Each price cell has background color from green (min price) to red (max price).

      Round-trip grid (2D):
        Table with:
          Rows: unique departure dates (sorted ascending) as row headers
          Columns: unique return dates (sorted ascending) as column headers
          Cells: cheapest price for that (departure, return) pair, or empty if no offer
        Each non-empty cell has background color from green (min) to red (max) across
        all cells in the grid.

      Color function:
        function priceColor(price: number, min: number, max: number): string {
          if (max === min) return 'hsl(120, 70%, 45%)'; // all same price = green
          const ratio = (price - min) / (max - min);
          const hue = Math.round(120 - ratio * 120); // 120=green, 0=red
          return `hsl(${hue}, 70%, 45%)`;
        }

    acceptance_criteria: |
      Vitest + RTL tests in frontend/src/components/PriceGrid/PriceGrid.test.tsx:

      One-way grid renders correct number of rows:
        setup: 3 offers with departure_dates [2026-04-01, 2026-04-02, 2026-04-01]
               and prices ["150.00", "89.99", "120.00"]
        expected: 2 data rows (2026-04-01 shows "120.00" as cheapest, 2026-04-02 shows "89.99")

      One-way grid rows sorted by date:
        setup: offers with dates in random order
        expected: rows appear in ascending date order

      Round-trip grid renders correct dimensions:
        setup: offers with 2 unique departure dates and 2 unique return dates
        expected: 2 row headers + 2 column headers (4 data cells possible)

      Round-trip empty cell when no offer for that date pair:
        setup: offers only cover [dep1,ret1] and [dep2,ret2], not [dep1,ret2]
        expected: cell at [dep1,ret2] is empty

      priceColor returns green for min price:
        input: priceColor(100, 100, 200)
        expected: returned string contains "120" (hue=120, green)

      priceColor returns red for max price:
        input: priceColor(200, 100, 200)
        expected: returned string contains "0" (hue=0, red)

      priceColor handles all-same prices:
        input: priceColor(150, 150, 150)
        expected: no NaN, returns valid hsl string

    implementation_guidelines: |
      - Extract cheapest price per date: use `reduce` to build a Map<date, price>.
        For round-trip use a Map keyed on `${dep}:${ret}`.
      - Sort dates: `[...dates].sort()` — ISO date strings sort lexicographically.
      - Color function: export separately as `priceColor()` so it can be unit-tested
        without rendering. Put in PriceGrid.tsx or a utils file.
      - Table accessibility: use `<table>`, `<thead>`, `<tbody>`, `<th scope="row">`,
        `<th scope="col">` for screen reader compatibility.
      - For round-trip grid with many dates (up to 30×30=900 cells), the table should
        still render correctly; no virtualization needed at this scale.
      - Apply background color as inline style:
          style={{ backgroundColor: priceColor(price, minPrice, maxPrice), color: '#fff' }}

