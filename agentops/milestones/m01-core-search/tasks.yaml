  - id: t03
    name: amadeus-client-and-error-handler
    description: |
      Implement the Amadeus Client singleton factory and the global FastAPI exception
      handler that maps amadeus.ResponseError to appropriate HTTP status codes.
    interfaces: |
      File: backend/src/app/services/amadeus_client.py

      from amadeus import Client
      from app.config import get_settings
      import functools

      @functools.lru_cache(maxsize=1)
      def get_amadeus_client() -> Client:
          """Return a cached singleton Amadeus Client instance.

          Called at first use (lazy init). Raises RuntimeError if credentials
          are not configured.
          """
          settings = get_settings()
          return Client(
              client_id=settings.amadeus_client_id,
              client_secret=settings.amadeus_client_secret,
              hostname=settings.amadeus_hostname,
          )

      File: backend/src/app/api/error_handlers.py

      from fastapi import Request
      from fastapi.responses import JSONResponse
      from amadeus import ResponseError

      async def amadeus_exception_handler(request: Request, exc: ResponseError) -> JSONResponse:
          """Map amadeus ResponseError to HTTP responses."""
          ...
          # status_code mapping:
          # 401 -> 503 {"detail": "Invalid Amadeus API credentials."}
          # 429 -> 429 {"detail": "Rate limit exceeded. Please wait 60 seconds before retrying."}
          # 400 -> 422 {"detail": "Invalid search parameters: <exc message>"}
          # 404 -> 200 with empty list (no results) -- NOTE: handled in service layer, not here
          # 5xx -> 502 {"detail": "Flight data service temporarily unavailable."}
          # other -> 500 {"detail": "Unexpected error."}

    acceptance_criteria: |
      Tests in tests/test_error_handlers.py using httpx TestClient:

      When amadeus returns 429 (rate limit):
        input: route raises ResponseError with mock response status_code=429
        expected: HTTP 429, body contains "Rate limit exceeded"

      When amadeus returns 401 (auth error):
        input: route raises ResponseError with mock response status_code=401
        expected: HTTP 503, body contains "credentials"

      When amadeus returns 500 (server error):
        input: route raises ResponseError with mock response status_code=500
        expected: HTTP 502, body contains "temporarily unavailable"

      When amadeus returns 400 (bad params):
        input: route raises ResponseError with mock response status_code=400
        expected: HTTP 422

      get_amadeus_client() returns same instance on repeated calls:
        input: call get_amadeus_client() twice
        expected: both calls return same object (id(a) == id(b))

      get_amadeus_client() uses correct hostname:
        input: AMADEUS_HOSTNAME=test in env
        expected: client.hostname == 'test'

    implementation_guidelines: |
      - `get_amadeus_client()` uses `@functools.lru_cache(maxsize=1)` — this is a
        module-level singleton. Reset between tests using
        `get_amadeus_client.cache_clear()`.
      - For testing error_handlers: use `httpx.AsyncClient(app=app)` or
        `TestClient(app)` with a route that deliberately raises ResponseError via monkeypatch.
      - To construct a mock ResponseError for tests:
        ```python
        from unittest.mock import MagicMock
        from amadeus import ResponseError
        mock_response = MagicMock()
        mock_response.status_code = 429
        exc = ResponseError(mock_response)
        ```
      - The exception handler is registered in main.py:
        `app.add_exception_handler(ResponseError, amadeus_exception_handler)`
      - `amadeus_exception_handler` must be `async def` (FastAPI exception handler
        signature requires it) even though no await is used inside.

