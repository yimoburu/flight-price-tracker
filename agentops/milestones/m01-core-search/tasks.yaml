      from amadeus import Client, ResponseError, Location
      from app.schemas.search import AirportResult

      def search_airports(query: str, client: Client) -> list[AirportResult]:
          """Search airports and cities by keyword.

          Args:
              query: search keyword, minimum 3 characters
              client: Amadeus Client instance

          Returns:
              List of up to 10 AirportResult objects sorted by relevance
              (Amadeus returns them pre-sorted).

          Raises:
              amadeus.ResponseError: propagated to caller (caught by exception handler)
          """

      Route handler in backend/src/app/api/search.py:

      @router.get("/airports", response_model=list[AirportResult])
      def airports(
          q: str = Query(..., min_length=3, description="Airport/city search keyword"),
          settings: Settings = Depends(get_settings),
      ) -> list[AirportResult]:
          client = get_amadeus_client()
          return search_airports(q, client)

    acceptance_criteria: |
