        disabled?: boolean;
      }

      export function AirportAutocomplete(props: AirportAutocompleteProps): JSX.Element

      Behavior:
      - Renders a text input showing selected airport as "{IATA} — {city}" or empty
      - On input change: clear selection, set query string
      - After 300ms debounce: if query.length >= 3, call searchAirports(query)
      - Show dropdown list of up to 10 results below input
      - Each dropdown item shows: "{IATA} — {city}, {country}" on first line,
        airport name on second line (smaller text)
      - Click/Enter on item: set selected airport, close dropdown
      - Escape key: close dropdown without selecting
      - On blur: close dropdown after 150ms delay (allow click to register first)
      - Loading state: show spinner or "Searching..." text while fetching
      - Error state: show error message below input
      - If query < 3 chars: show "Type at least 3 characters" hint or nothing

    acceptance_criteria: |
      Vitest + React Testing Library tests in
      frontend/src/components/AirportAutocomplete/AirportAutocomplete.test.tsx:

      Typing 3+ characters triggers searchAirports after debounce:
        setup: mock searchAirports to return [LHR, LGW]
        action: type "LON" into input, wait 300ms (use fake timers)
        expected: searchAirports called with "LON"; dropdown shows 2 items

      Typing fewer than 3 characters does not call searchAirports:
        action: type "LO" into input, advance timers
        expected: searchAirports NOT called

      Selecting an item from dropdown calls onChange with AirportResult:
        setup: dropdown visible with [LHR, LGW]
        action: click on LHR item
        expected: onChange called with AirportResult{iata_code: "LHR", ...}

      Escape key closes dropdown:
        setup: dropdown visible
        action: press Escape
        expected: dropdown not visible

      Input has correct accessibility attributes:
        expected: input has role="combobox", aria-autocomplete="list",
                  aria-expanded="true" when open / "false" when closed,
                  associated label via htmlFor/id

      Component renders with disabled prop set:
        action: render with disabled=true
        expected: input element has disabled attribute

    implementation_guidelines: |
      - Use `useEffect` + `clearTimeout` for 300ms debounce pattern:
          useEffect(() => {
            if (query.length < 3) { setSuggestions([]); return; }
            const timer = setTimeout(() => {
              setLoading(true);
              searchAirports(query)
                .then(setSuggestions)
                .catch(e => setError(e.message))
                .finally(() => setLoading(false));
            }, 300);
            return () => clearTimeout(timer);
          }, [query]);
      - Use AbortController to cancel in-flight fetch requests:
          Modify searchAirports to accept an optional AbortSignal parameter.
          Pass `controller.signal` and abort in cleanup.
      - Dropdown list: use `<ul role="listbox">` with `<li role="option">` items.
      - Input: use `role="combobox"` with `aria-expanded`, `aria-controls` pointing to listbox.
      - Keyboard navigation (arrow keys to move focus through options) is a nice-to-have;
        Escape to close and Enter to select are required.
      - Use CSS modules or inline styles — no CSS framework dependency.
      - onBlur delay: use `setTimeout(() => setOpen(false), 150)` so mousedown on
        dropdown item fires before the input loses focus.

