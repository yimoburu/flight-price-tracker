  - id: t05
    name: flight-search-service
    description: |
      Implement the core flight search business logic: two-step Amadeus API call
      (cheapest dates calendar → flight offers), date range filtering, max_stops
      filtering, result mapping, and in-memory TTL caching.
    interfaces: |
      File: backend/src/app/services/flight_service.py (extend from t04)

      import threading
      from cachetools import TTLCache
      from amadeus import Client, ResponseError
      from app.schemas.search import SearchRequest, FlightOfferResponse, SegmentInfo
      from datetime import date

      # Module-level cache: max 128 entries, 15-minute TTL
      _cache: TTLCache = TTLCache(maxsize=128, ttl=900)
      _cache_lock: threading.Lock = threading.Lock()

      def search_flights(request: SearchRequest, client: Client) -> list[FlightOfferResponse]:
          """Search for flight offers across a date range.

          Algorithm:
          1. Build cache key from request fields (all params as sorted tuple)
          2. Return cached result if present (cache_lock acquired)
          3. Call amadeus flight_dates.get() to get cheapest date calendar
          4. Filter calendar entries to user's date window
          5. For round_trip: also filter return_date within return window
          6. Sort filtered entries by price ascending, take top 5
          7. For each top-5 date (or date pair for round_trip):
             Call flight_offers_search.get() with that specific date
          8. Flatten all offers, apply max_stops filter if set
          9. Sort by total price ascending
          10. Map each offer to FlightOfferResponse
          11. Store in cache
          12. Return results

          Args:
              request: validated SearchRequest
              client: Amadeus Client instance

          Returns:
              List of FlightOfferResponse sorted by price ascending.
              Empty list if no results found.

          Raises:
              amadeus.ResponseError: propagated (caught by exception handler in main.py)
          """

      def _build_cache_key(request: SearchRequest) -> tuple:
          """Build a hashable cache key from all search parameters."""
          return (
              request.origin, request.destination, request.trip_type,
              str(request.departure_date_from), str(request.departure_date_to),
              str(request.return_date_from), str(request.return_date_to),
              request.adults, request.max_stops,
          )

      def _map_offer_to_response(offer: dict, trip_type: str) -> FlightOfferResponse:
          """Map a raw Amadeus flight offer dict to FlightOfferResponse."""
          # offer structure (Amadeus Flight Offers Search v2 response):
          # offer['price']['grandTotal'] -> total price string
          # offer['price']['currency']   -> currency code
          # offer['itineraries']         -> list of itinerary objects
          #   itinerary['segments']      -> list of segment objects
          #     segment['departure']['iataCode']     -> departure airport
          #     segment['departure']['at']           -> departure datetime string
          #     segment['arrival']['iataCode']       -> arrival airport
          #     segment['arrival']['at']             -> arrival datetime string
          #     segment['carrierCode']               -> airline IATA code
          #     segment['number']                    -> flight number
          #     segment['duration']                  -> duration e.g. "PT7H30M"
          #     segment['numberOfStops']             -> int stops en route
          # For one_way: itineraries[0] = outbound only
          # For round_trip: itineraries[0] = outbound, itineraries[1] = return

    acceptance_criteria: |
      Unit tests in tests/test_flight_service.py:

      Cache hit returns cached result without calling amadeus:
        setup: pre-populate cache with cache key for a given request
        input: call search_flights() with same request
        expected: amadeus client methods NOT called; cached result returned

      Cache miss calls amadeus and stores result:
        setup: empty cache, mock client
        input: search_flights() with valid one_way request
        expected: amadeus.shopping.flight_dates.get called once;
                  amadeus.shopping.flight_offers_search.get called (up to 5 times);
                  result stored in cache after call

      Date range filter: only dates within window returned:
        setup: mock flight_dates returns dates [2026-04-01, 2026-04-10, 2026-04-20, 2026-05-01]
               request window: departure_date_from=2026-04-05, departure_date_to=2026-04-15
        expected: only 2026-04-10 is passed to flight_offers_search

      max_stops=0 filters out flights with stops:
        setup: mock flight_offers returns 3 offers: [{stops:0}, {stops:1}, {stops:0}]
               request.max_stops=0
        expected: returned list has 2 offers (the nonstop ones)

      max_stops=null returns all offers:
        setup: same 3 offers as above
               request.max_stops=None
        expected: all 3 offers returned (subject to price sort)

      Results sorted by price ascending:
        setup: mock returns offers with prices ["150.00", "89.99", "200.00"]
        expected: returned list is sorted [89.99, 150.00, 200.00]

      Empty results when no dates in window:
        setup: mock flight_dates returns dates all outside the window
        expected: returns empty list; flight_offers_search NOT called

      round_trip: two itineraries in offer mapped correctly:
        setup: mock offer with itineraries[0] (outbound) and itineraries[1] (return),
               each with one segment
        expected: FlightOfferResponse.outbound_segments has 1 item,
                  FlightOfferResponse.return_segments has 1 item,
                  FlightOfferResponse.return_date is set

    implementation_guidelines: |
      Flight Dates API call:
        For one_way:
          response = client.shopping.flight_dates.get(
              origin=request.origin,
              destination=request.destination,
              oneWay='true'
          )
        For round_trip:
          response = client.shopping.flight_dates.get(
              origin=request.origin,
              destination=request.destination,
          )
          (oneWay defaults to False/round_trip behavior)

      Date filtering:
        for item in response.data:
            dep_date = date.fromisoformat(item['departureDate'])
            if request.departure_date_from <= dep_date <= request.departure_date_to:
                filtered.append(item)
        For round_trip also check:
            ret_date = date.fromisoformat(item.get('returnDate', '9999-01-01'))
            if request.return_date_from <= ret_date <= request.return_date_to: ...

      Flight Offers call per date:
        params = {
            'originLocationCode': request.origin,
            'destinationLocationCode': request.destination,
            'departureDate': str(date_item['departureDate']),
            'adults': request.adults,
            'max': 10,
        }
        if request.trip_type == 'round_trip':
            params['returnDate'] = str(date_item['returnDate'])
        if request.max_stops == 0:
            params['nonStop'] = 'true'
        response = client.shopping.flight_offers_search.get(**params)

      max_stops filtering (after fetching, when max_stops is 1 or 2):
        Count total stops as sum of stops across all segments in outbound itinerary.
        Filter: sum(seg['numberOfStops'] + (1 if there are connecting segments else 0))
        Simpler approach: count len(itineraries[0]['segments']) - 1 for connection count
        plus sum of segment['numberOfStops'] for en-route stops.
        For this project use: total_stops = len(itinerary['segments']) - 1
        (each segment after the first represents a connection).

      Offer mapping (_map_offer_to_response):
        price = offer['price']['grandTotal']
        currency = offer['price']['currency']
        outbound = offer['itineraries'][0]
        outbound_segments = [_map_segment(s) for s in outbound['segments']]
        departure_date = date.fromisoformat(outbound['segments'][0]['departure']['at'][:10])
        For round_trip:
          return_itin = offer['itineraries'][1]
          return_segments = [_map_segment(s) for s in return_itin['segments']]
          return_date = date.fromisoformat(return_itin['segments'][0]['departure']['at'][:10])

      Segment mapping:
        SegmentInfo(
          airline=seg['carrierCode'],
          flight_number=f"{seg['carrierCode']} {seg['number']}",
          departure_airport=seg['departure']['iataCode'],
          departure_time=seg['departure']['at'],
          arrival_airport=seg['arrival']['iataCode'],
          arrival_time=seg['arrival']['at'],
          duration=seg['duration'],
          stops=seg.get('numberOfStops', 0),
        )

      Cache key security: use `_build_cache_key()` with all params as a sorted tuple.
      Cache operations must be wrapped in `with _cache_lock:` — TTLCache is not
      thread-safe and FastAPI def routes run in a threadpool.

    dependencies: [t02, t03]

