  - id: t02
    name: pydantic-schemas
    description: |
      Implement all Pydantic v2 request/response schemas used by the search API.
      These schemas must validate all inputs and serve as the contract between
      route handlers and service layer.
    interfaces: |
      File: backend/src/app/schemas/search.py

      from pydantic import BaseModel, Field, field_validator, model_validator
      from datetime import date
      from typing import Literal

      class SearchRequest(BaseModel):
          origin: str = Field(..., min_length=3, max_length=3)
          destination: str = Field(..., min_length=3, max_length=3)
          trip_type: Literal['one_way', 'round_trip']
          departure_date_from: date
          departure_date_to: date
          return_date_from: date | None = None
          return_date_to: date | None = None
          adults: int = Field(default=1, ge=1, le=9)
          max_stops: int | None = Field(default=None, ge=0, le=2)

          @field_validator('origin', 'destination')
          @classmethod
          def must_be_iata(cls, v: str) -> str:
              # Must be exactly 3 uppercase ASCII letters
              ...

          @model_validator(mode='after')
          def validate_dates(self) -> 'SearchRequest':
              # departure_date_from must not be in the past (today is ok)
              # departure_date_to >= departure_date_from
              # (departure_date_to - departure_date_from).days <= 30
              # For round_trip: return_date_from and return_date_to must be present
              # For round_trip: (return_date_to - return_date_from).days <= 30
              # For round_trip: return_date_from >= departure_date_from
              ...

      class SegmentInfo(BaseModel):
          airline: str              # e.g. "BA"
          flight_number: str        # e.g. "BA 123"
          departure_airport: str    # IATA code e.g. "LHR"
          departure_time: str       # ISO datetime string "2024-11-01T10:30:00"
          arrival_airport: str      # IATA code e.g. "JFK"
          arrival_time: str         # ISO datetime string
          duration: str             # ISO 8601 duration e.g. "PT7H30M"
          stops: int                # 0 = nonstop

      class FlightOfferResponse(BaseModel):
          price: str               # e.g. "298.50"
          currency: str            # e.g. "USD"
          departure_date: date
          return_date: date | None = None
          outbound_segments: list[SegmentInfo]
          return_segments: list[SegmentInfo] = []

      class AirportResult(BaseModel):
          iata_code: str
          name: str
          city: str
          country: str

    acceptance_criteria: |
      Input/output test cases (must pass as pytest tests in tests/test_schemas.py):

      Valid SearchRequest:
        input: {origin: "JFK", destination: "LAX", trip_type: "one_way",
                departure_date_from: "2026-04-01", departure_date_to: "2026-04-15",
                adults: 2}
        expected: model parses without error, origin == "JFK", adults == 2

      IATA validation rejects lowercase:
        input: {origin: "jfk", ...}
        expected: ValidationError raised

      IATA validation rejects 4-letter code:
        input: {origin: "KJFK", ...}
        expected: ValidationError raised (length constraint enforced by Field)

      Departure in past rejects:
        input: {departure_date_from: "2020-01-01", departure_date_to: "2020-01-10", ...}
        expected: ValidationError raised

      Date range > 30 days rejects:
        input: {departure_date_from: "2026-04-01", departure_date_to: "2026-05-15", ...}
        expected: ValidationError raised

      Round-trip missing return dates rejects:
        input: {trip_type: "round_trip", return_date_from: null, return_date_to: null, ...}
        expected: ValidationError raised

      Return range > 30 days rejects:
        input: {trip_type: "round_trip", return_date_from: "2026-04-01",
                return_date_to: "2026-05-15", ...}
        expected: ValidationError raised

      max_stops null passes (any stops allowed):
        input: {max_stops: null, ...}
        expected: model.max_stops is None

      max_stops -1 rejects (ge=0):
        input: {max_stops: -1, ...}
        expected: ValidationError raised

    implementation_guidelines: |
      - Use Pydantic v2 syntax throughout (field_validator, model_validator, Field).
      - IATA validator: use `re.match(r'^[A-Z]{3}$', v)` — uppercase letters only.
        Must be exactly 3 characters (Field min_length/max_length handles length,
        validator handles uppercase-alpha constraint).
      - Date validators: use `from datetime import date; date.today()` for "not in past".
        Use `.days` property on timedelta for range check.
      - Do not import amadeus in schemas — schemas must be importable without credentials.
      - All schema classes must be importable from `app.schemas.search`.

