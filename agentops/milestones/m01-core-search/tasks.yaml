      - POC amadeus-sdk-async: agentops/milestones/m01-core-search/poc/amadeus-sdk-async.md
      - Amadeus SDK: agentops/milestones/m01-core-search/research/amadeus_python_sdk.md
      - cachetools: https://cachetools.readthedocs.io/en/stable/

