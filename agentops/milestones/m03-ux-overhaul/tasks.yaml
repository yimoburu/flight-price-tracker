tasks:
  - id: t01
    name: "Tailwind CSS + shadcn/ui tooling setup"
    description: |
      Install Tailwind CSS v3 (PostCSS approach), configure the build pipeline, install all required
      shadcn/ui components, and add Inter font. This task creates the foundation that all other tasks
      depend on. No React component changes — only config, package.json, and the global CSS file.
    interfaces: |
      Files produced/modified:
        frontend/package.json
          - devDependencies: tailwindcss@^3, postcss, autoprefixer
          - dependencies: @fontsource/inter (NEW)
          - dependencies: radix-ui, lucide-react, clsx, tailwind-merge, class-variance-authority (installed by shadcn CLI)
        frontend/tailwind.config.ts (NEW)
        frontend/postcss.config.js (NEW)
        frontend/tsconfig.json — add baseUrl + paths alias
        frontend/vite.config.ts — add resolve.alias + path import
        frontend/src/index.css (NEW — Tailwind directives + CSS variables)
        frontend/src/main.tsx — add CSS and font imports
        frontend/components.json (NEW — shadcn config)
        frontend/src/lib/utils.ts (NEW — cn() utility)
        frontend/src/components/ui/*.tsx (11 files — Button, Card, Badge, Dialog, Input, Label,
          Select, Skeleton, Separator, Tooltip, AlertDialog)
    acceptance_criteria: |
      1. `cd frontend && npm install` completes without error.
      2. `cd frontend && npm run build` produces a dist/assets/*.css file containing Tailwind base
         styles (check for `box-sizing: border-box` in the CSS output).
      3. `cd frontend && npm test` passes all 98 tests (12 test files).
      4. `frontend/src/components/ui/dialog.tsx` exists and contains `DialogContent` export.
      5. `frontend/src/lib/utils.ts` exports a `cn` function.
      6. `frontend/src/index.css` begins with `@tailwind base;` and has `:root { --background: ...}`.
      7. `import { Button } from '@/components/ui/button'` resolves in TypeScript without error
         (run `cd frontend && npx tsc --noEmit` to verify).
    implementation_guidelines: |
      STEP 1: Install Tailwind CSS v3 + PostCSS
        cd frontend
        npm install -D tailwindcss@3 postcss autoprefixer
        npm install @fontsource/inter

      STEP 2: Update tsconfig.json — add inside compilerOptions:
        "baseUrl": ".",
        "paths": { "@/*": ["./src/*"] }

      STEP 3: Update vite.config.ts — add path import and resolve.alias:
        import path from 'path';
        // inside defineConfig:
        resolve: {
          alias: { '@': path.resolve(__dirname, './src') },
        },

      STEP 4: Run shadcn init (NON-INTERACTIVE — verified in POC):
        cd frontend
        npx shadcn@latest init --template=vite --yes --base=radix --preset=nova
        npx shadcn@latest add card badge dialog input label select skeleton separator tooltip alert-dialog --yes

      STEP 5: Replace the shadcn-generated src/index.css entirely with this content
      (the Nova preset generates v4-syntax CSS that breaks Tailwind v3 — replace it):
        @tailwind base;
        @tailwind components;
        @tailwind utilities;

        @layer base {
          :root {
            --background: 210 40% 98%;
            --foreground: 222 84% 5%;
            --card: 0 0% 100%;
            --card-foreground: 222 84% 5%;
            --popover: 0 0% 100%;
            --popover-foreground: 222 84% 5%;
            --primary: 199 89% 48%;
            --primary-foreground: 0 0% 100%;
            --secondary: 210 40% 96%;
            --secondary-foreground: 222 84% 5%;
            --muted: 210 40% 96%;
            --muted-foreground: 215 16% 47%;
            --accent: 210 40% 96%;
            --accent-foreground: 222 84% 5%;
            --destructive: 0 84% 60%;
            --destructive-foreground: 0 0% 100%;
            --border: 214 32% 91%;
            --input: 214 32% 91%;
            --ring: 199 89% 48%;
            --radius: 0.5rem;
          }
          * { @apply border-border; }
          body { @apply bg-background text-foreground font-sans; }
        }

      STEP 6: Replace frontend/tailwind.config.ts with:
        import type { Config } from 'tailwindcss';
        export default {
          darkMode: ['class'],
          content: ['./index.html', './src/**/*.{ts,tsx}'],
          theme: {
            extend: {
              fontFamily: {
                sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              },
              colors: {
                brand: { 50: '#f0f9ff', 500: '#0284c7', 600: '#0284c7', 700: '#0369a1' },
                border: 'hsl(var(--border))',
                input: 'hsl(var(--input))',
                ring: 'hsl(var(--ring))',
                background: 'hsl(var(--background))',
                foreground: 'hsl(var(--foreground))',
                primary: { DEFAULT: 'hsl(var(--primary))', foreground: 'hsl(var(--primary-foreground))' },
                secondary: { DEFAULT: 'hsl(var(--secondary))', foreground: 'hsl(var(--secondary-foreground))' },
                muted: { DEFAULT: 'hsl(var(--muted))', foreground: 'hsl(var(--muted-foreground))' },
                accent: { DEFAULT: 'hsl(var(--accent))', foreground: 'hsl(var(--accent-foreground))' },
                destructive: { DEFAULT: 'hsl(var(--destructive))', foreground: 'hsl(var(--destructive-foreground))' },
                card: { DEFAULT: 'hsl(var(--card))', foreground: 'hsl(var(--card-foreground))' },
                popover: { DEFAULT: 'hsl(var(--popover))', foreground: 'hsl(var(--popover-foreground))' },
              },
              borderRadius: {
                lg: 'var(--radius)',
                md: 'calc(var(--radius) - 2px)',
                sm: 'calc(var(--radius) - 4px)',
              },
            },
          },
          plugins: [],
        } satisfies Config;

      STEP 7: Update frontend/src/main.tsx — add at top:
        import '@fontsource/inter/400.css';
        import '@fontsource/inter/600.css';
        import './index.css';

      STEP 8: Create frontend/postcss.config.js:
        export default {
          plugins: {
            tailwindcss: {},
            autoprefixer: {},
          },
        };

      IMPORTANT GOTCHA: The shadcn CLI installs 'shadcn' as a runtime dependency.
      This is normal — remove it from dependencies if unwanted, but it's harmless.

      IMPORTANT GOTCHA: After step 4, if components.json has "style": "radix-nova",
      the generated components import from "radix-ui" (new unified package), NOT from
      "@radix-ui/react-*". This is correct — do not change the import paths.
    dependencies: []
    reference_docs: |
      - poc/tailwind-vite-integration.md (VIABLE result)
      - poc/shadcn-noninteractive.md (VIABLE result with constraints)
      - poc/vitest-css-compat.md (VIABLE result)
      - research/tailwind-shadcn-setup.md
    status: in-review
    completed_at: "2026-04-07T00:00:00Z"
    retry_count: 0
    assigned_task_id: null
    completed_at: null

  - id: t02
    name: "App shell layout and NavBar redesign"
    description: |
      Style the global app shell (App.tsx) and the NavBar component. The NavBar becomes a fixed
      top bar with brand logo, active-route highlighting, and shadow. App.tsx wraps everything
      in the layout div and moves the <main> wrapper inside it.
    interfaces: |
      Files modified:
        frontend/src/App.tsx
        frontend/src/components/NavBar/index.tsx
      No prop signature changes. No new component files.
    acceptance_criteria: |
      1. NavBar is visually fixed at the top: scrolling the page does not scroll the NavBar.
      2. NavBar contains a Plane icon and "FlightTracker" text, both in text-sky-600.
      3. On the "/" route, the "Search" link is visually highlighted (e.g., border-b-2 border-sky-600).
         On "/tracked" route, "My Tracked Searches" link is highlighted.
      4. NavBar has a white background and a 1px bottom border.
      5. Page content does not overlap the NavBar (main content has top padding ≥ 56px).
      6. NavBar is visible on both pages when navigating.
      7. All 98 existing tests pass (NavBar tests use MemoryRouter — confirm NavBar renders links).
      8. `npm run build` produces no TypeScript errors.
    implementation_guidelines: |
      frontend/src/App.tsx:
        - Add className="min-h-screen bg-sky-50 font-sans" to outer wrapper div
        - Wrap <Routes> in <main className="max-w-5xl mx-auto px-4 py-8 pt-20">
          (pt-20 = 80px top padding to clear the 56px fixed NavBar + visual breathing room)
        - Remove any <main> wrapper from HomePage.tsx and TrackedSearchesPage.tsx if present

      frontend/src/components/NavBar/index.tsx:
        - Add `import { useLocation } from 'react-router-dom';`
        - Add `import { Plane } from 'lucide-react';`
        - Outer nav: className="fixed top-0 left-0 right-0 z-50 h-14 bg-white border-b border-neutral-200 shadow-sm"
        - Inner div: className="max-w-5xl mx-auto px-4 h-full flex items-center justify-between"
        - Brand section (left): <div className="flex items-center gap-2">
            <Plane className="h-5 w-5 text-sky-600" />
            <span className="font-bold text-sky-600 text-lg">FlightTracker</span>
          </div>
        - Nav links (right): <div className="flex items-center gap-6">
        - For each link, check `location.pathname === '/'` (or '/tracked') for active state:
          activeClass = "text-sky-600 font-medium border-b-2 border-sky-600 pb-0.5"
          inactiveClass = "text-neutral-600 hover:text-sky-600 transition-colors"
        - Link text stays: "Search" and "My Tracked Searches"

      HomePage.tsx: Remove the <main> wrapper (it moves to App.tsx). Keep <> fragment or <div>.
      TrackedSearchesPage.tsx: Remove the <main> wrapper. Keep the h1 and content.

      NOTE: NavBar.test.tsx renders <NavBar /> wrapped in a MemoryRouter. The test checks for
      Link elements. Since NavBar now uses useLocation(), it MUST be rendered inside a Router.
      NavBar.test.tsx already wraps with MemoryRouter, so tests should still pass as-is.
      Verify by running `npm test` after changes.
    dependencies: [t01]
    reference_docs: |
      - frontend/src/App.tsx (current)
      - frontend/src/components/NavBar/index.tsx (current)
      - prd.md section 4.2
    status: in-review
    retry_count: 0
    assigned_task_id: null
    completed_at: "2026-04-08T09:05:00Z"

  - id: t03
    name: "SearchForm and AirportAutocomplete redesign"
    description: |
      Style the SearchForm with a Card container, pill trip-type toggle, side-by-side date inputs,
      and a prominent search button with loading spinner. Style the AirportAutocomplete with an
      icon prefix and floating suggestion dropdown. Implement the return-date row with
      visibility-hidden layout-shift prevention (UX Warning #3).
    interfaces: |
      Files modified:
        frontend/src/components/SearchForm/index.tsx
        frontend/src/components/AirportAutocomplete/index.tsx
      No prop signature changes. All existing state and validation logic is preserved verbatim.
    acceptance_criteria: |
      1. SearchForm is wrapped in a Card with visible border, padding, and shadow.
      2. "One Way" and "Round Trip" buttons look like pill-tabs; active one has sky-blue background.
      3. Origin and Destination inputs are displayed side-by-side on screens ≥ 768px.
      4. Departure date "From" and "To" inputs are side-by-side.
      5. Return date row is ALWAYS present in the DOM. When trip type is "One Way":
         the row has `visibility: hidden` (not `display: none`) so vertical space is preserved.
         When "Round Trip": the row is visible and interactive.
      6. Search button is full-width, sky-blue, h-12 tall.
      7. When isLoading=true: Search button shows a spinning Loader2 icon.
      8. AirportAutocomplete dropdown suggestion list has white background, shadow, border, and rounded corners.
      9. IATA code in each suggestion row is bold and sky-700 colored.
      10. `npm test` — EXPECTED TEST UPDATE: the test "return date fields are hidden for one_way"
          uses `queryByLabelText('Return from') → not.toBeInTheDocument()`. Since elements are now
          always in the DOM, update this test to instead assert:
          `expect(screen.getByLabelText('Return from').closest('div')).toHaveStyle('visibility: hidden')`
          All other SearchForm tests must still pass unchanged.
      11. `npm run build` produces no TypeScript errors.
    implementation_guidelines: |
      SearchForm/index.tsx — keep ALL existing state variables and validation logic.
      Only rewrite the JSX return block.

      Imports to add:
        import { Card, CardHeader, CardContent, CardTitle } from '@/components/ui/card';
        import { Loader2 } from 'lucide-react';

      Return JSX structure:
        <Card className="w-full">
          <CardHeader className="pb-4">
            <CardTitle className="text-lg font-semibold">Find Flights</CardTitle>
          </CardHeader>
          <CardContent>
            <form onSubmit={handleSubmit} noValidate className="flex flex-col gap-4">

              {/* Trip type toggle */}
              <div className="flex gap-1 p-1 bg-neutral-100 rounded-full w-fit">
                <button type="button" aria-pressed={tripType === 'one_way'}
                  onClick={() => setTripType('one_way')}
                  className={`px-4 py-1.5 rounded-full text-sm font-medium transition-all ${
                    tripType === 'one_way'
                      ? 'bg-sky-600 text-white shadow-sm'
                      : 'text-neutral-700 hover:text-neutral-900'
                  }`}>One Way</button>
                <button type="button" aria-pressed={tripType === 'round_trip'}
                  onClick={() => setTripType('round_trip')}
                  className={`px-4 py-1.5 rounded-full text-sm font-medium transition-all ${
                    tripType === 'round_trip'
                      ? 'bg-sky-600 text-white shadow-sm'
                      : 'text-neutral-700 hover:text-neutral-900'
                  }`}>Round Trip</button>
              </div>

              {/* Airport row */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <AirportAutocomplete label="Origin" id="origin" value={origin} onChange={setOrigin} />
                <AirportAutocomplete label="Destination" id="destination" value={destination} onChange={setDestination} />
              </div>

              {/* Departure date row */}
              <div className="grid grid-cols-2 gap-4">
                <div className="flex flex-col gap-1">
                  <label htmlFor="dep-from" className="text-sm font-medium text-neutral-700">Departure from</label>
                  <input type="date" id="dep-from" value={depFrom} min={today}
                    onChange={(e) => setDepFrom(e.target.value)}
                    className="border border-neutral-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400" />
                </div>
                <div className="flex flex-col gap-1">
                  <label htmlFor="dep-to" className="text-sm font-medium text-neutral-700">Departure to</label>
                  <input type="date" id="dep-to" value={depTo} min={today}
                    onChange={(e) => setDepTo(e.target.value)}
                    className="border border-neutral-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400" />
                </div>
              </div>

              {/* Return date row — ALWAYS rendered, hidden via visibility */}
              <div className={`grid grid-cols-2 gap-4 transition-all duration-200 ${
                tripType === 'one_way'
                  ? 'invisible opacity-0 pointer-events-none h-0 overflow-hidden'
                  : 'visible opacity-100'
              }`}>
                <div className="flex flex-col gap-1">
                  <label htmlFor="ret-from" className="text-sm font-medium text-neutral-700">Return from</label>
                  <input type="date" id="ret-from" value={retFrom} min={today}
                    onChange={(e) => setRetFrom(e.target.value)}
                    className="border border-neutral-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400" />
                </div>
                <div className="flex flex-col gap-1">
                  <label htmlFor="ret-to" className="text-sm font-medium text-neutral-700">Return to</label>
                  <input type="date" id="ret-to" value={retTo} min={today}
                    onChange={(e) => setRetTo(e.target.value)}
                    className="border border-neutral-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400" />
                </div>
              </div>

              {/* Adults + Max Stops row */}
              <div className="grid grid-cols-2 gap-4">
                <div className="flex flex-col gap-1">
                  <label htmlFor="adults" className="text-sm font-medium text-neutral-700">Adults</label>
                  <select id="adults" value={adults} onChange={(e) => setAdults(e.target.value)}
                    className="border border-neutral-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400">
                    {[1,2,3,4,5,6,7,8,9].map(n => <option key={n} value={n}>{n}</option>)}
                  </select>
                </div>
                <div className="flex flex-col gap-1">
                  <label htmlFor="max-stops" className="text-sm font-medium text-neutral-700">Max stops</label>
                  <select id="max-stops" value={maxStops} onChange={(e) => setMaxStops(e.target.value)}
                    className="border border-neutral-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400">
                    <option value="">Any</option>
                    <option value="0">Nonstop</option>
                    <option value="1">1 stop</option>
                  </select>
                </div>
              </div>

              {error && <p role="alert" className="text-sm text-red-500">{error}</p>}

              <button type="submit" disabled={isLoading}
                className="w-full h-12 bg-sky-600 hover:bg-sky-700 disabled:opacity-60 text-white rounded-lg font-medium flex items-center justify-center gap-2 transition-colors">
                {isLoading && <Loader2 className="h-4 w-4 animate-spin" />}
                Search
              </button>
            </form>
          </CardContent>
        </Card>

      IMPORTANT — Return date visibility approach:
      Use `h-0 overflow-hidden invisible opacity-0` for one_way so the element takes zero
      visual height but still exists in the DOM. The label still has htmlFor matching the input id,
      so getByLabelText still works in tests. The test "return date fields are hidden for one_way"
      must be updated to check for visibility/class rather than presence/absence.

      AirportAutocomplete/index.tsx — add icon prefix and dropdown styling:
      Imports: import { PlaneTakeoff, PlaneLanding } from 'lucide-react';
      - Wrap the input in a relative container: <div className="relative">
      - Add icon before the input inside a <div className="relative flex items-center">:
        <div className="absolute left-3 top-1/2 -translate-y-1/2 text-neutral-400 pointer-events-none">
          {label === 'Origin' ? <PlaneTakeoff className="h-4 w-4" /> : <PlaneLanding className="h-4 w-4" />}
        </div>
      - Input: add className="w-full pl-9 pr-3 py-2 border border-neutral-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-sky-400"
      - Dropdown ul: className="absolute z-50 w-full mt-1 bg-white shadow-lg border border-neutral-200 rounded-lg overflow-hidden max-h-64 overflow-y-auto"
      - Each li: className="px-3 py-2 cursor-pointer hover:bg-sky-50 flex flex-col"
      - IATA span: className="font-mono font-bold text-sky-700"
      - Name/city span: className="text-sm text-neutral-500"
    dependencies: [t01, t02]
    reference_docs: |
      - frontend/src/components/SearchForm/index.tsx (current)
      - frontend/src/components/AirportAutocomplete/index.tsx (current)
      - frontend/src/components/SearchForm/SearchForm.test.tsx (must review — one test needs update)
      - prd.md sections 4.3 and 4.4
    status: in-progress
    retry_count: 0
    assigned_task_id: null
